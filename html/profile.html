<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        
    <title>Melofy - User Profile</title>
</head>
<body>
    <nav>
        <div class="nav-logo">
            <a href="/"><img src="melofy-logo.png" alt="Melofy Logo" id="logo"></a>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <button id="auth-btn" class="nav-link-btn"></button>

        </div>
        <button id="theme-toggle" class="nav-link-btn" title="Toggle dark/light mode">
            <i id="icon-moon" class="fa-solid fa-moon fa-fw"></i>
            <i id="icon-sun"  class="fa-solid fa-sun fa-fw"  style="display: none;"></i>
        </button>
    </nav>
    
    <div class="profile-card">
        <h1>My Profile</h1>
      
        <img id="profile-img" src="" alt="Profile Picture" />
      
        <div class="profile-info">
          <p><strong>Username:</strong> <span id="profile-name"></span></p>
          <p><a id="spotify-link" href="#" target="_blank">Open Spotify Profile</a></p>
          <p><strong>Followers:</strong> <span id="profile-followers"></span></p>
        </div>
      
        <div class="profile-actions">
          <button onclick="window.location.href='create_playlist.html'">Create Playlist</button>
          <button onclick="syncSongs()">Sync Your Songs</button>
        </div>
      
        <div id="sync-status" class="status-msg" style="display:none;"></div>
      </div>      

    <script src="fetchapi.js"></script>
    <script src="dark_light_mode.js"></script>
</body>
</html>
